<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도면 뷰어</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<script src="https://unpkg.com/dxf-parser@1.1.2/dist/dxf-parser.js"></script>
</head>
<body class="cad-popup-page">

<div id="popup-main">
    <div id="popup-canvas-col">
        <div id="cad-viewer-wrap">
            <canvas id="cad-canvas"></canvas>
            <div id="cad-empty-msg">표시할 도면 없음<br><span>도면(.dxf) 파일을 선택하면 여기에 표시됩니다.</span></div>
            <div id="cad-overlay-controls">
                <div id="cad-toolbar">
                    <button id="cad-save-btn" title="이미지로 저장"><i class="fa-solid fa-floppy-disk"></i></button>
                    <button id="cad-print-btn" title="인쇄"><i class="fa-solid fa-print"></i></button>
                    <div class="cad-toolbar-divider"></div>
                    <button id="cad-zoom-in-btn" title="확대"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                    <button id="cad-zoom-out-btn" title="축소"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                    <button id="cad-fit-btn" title="전체보기"><i class="fa-solid fa-expand"></i></button>
                    <button id="cad-bg-toggle-btn" class="active" title="배경색 전환(흰/검)"><i class="fa-solid fa-circle-half-stroke"></i></button>
                    <div class="cad-toolbar-divider"></div>
                    <button id="cad-measure-dist-btn" title="거리 측정"><i class="fa-solid fa-ruler"></i></button>
                    <button id="cad-measure-area-btn" title="면적 측정"><i class="fa-solid fa-draw-polygon"></i></button>
                    <button id="cad-measure-clear-btn" title="측정 지우기"><i class="fa-solid fa-eraser"></i></button>
                </div>
                <div id="cad-status-bar">
                    <span id="cad-filename"></span>
                    <span id="cad-measure-result"></span>
                </div>
            </div>
        </div>
    </div>

    <div id="popup-side-col">
        <div id="route-info-panel">
            <div class="list-header">
                구간정보
                <button id="route-export-btn" title="이 노선의 전체 자료(SHP/DBF) 압축 다운로드" style="display:none;">
                    <i class="fa-solid fa-file-zipper"></i>
                </button>
            </div>
            <div class="info-row"><div class="info-label">도로종류</div><div class="info-value" id="ri-road-grade">-</div></div>
            <div class="info-row"><div class="info-label">노선명</div><div class="info-value" id="ri-route-name">-</div></div>
            <div class="info-row"><div class="info-label">구간명</div><div class="info-value" id="ri-segment-name">-</div></div>
            <div class="info-row"><div class="info-label">시점</div><div class="info-value" id="ri-start-point">-</div></div>
            <div class="info-row"><div class="info-label">종점</div><div class="info-value" id="ri-end-point">-</div></div>
            <div class="info-row"><div class="info-label">연장</div><div class="info-value" id="ri-length">-</div></div>
        </div>

        <div id="route-file-panel">
            <div id="route-file-tabs">
                <button class="route-tab-button active" data-cat="도로">도로</button>
                <button class="route-tab-button" data-cat="도면종류">도면</button>
                <button class="route-tab-button" data-cat="구조물">구조물</button>
                <button class="route-tab-button" data-cat="공사도면">공사도면</button>
                <button class="route-tab-button" data-cat="동영상">동영상</button>
            </div>
            <div id="route-drawing-type-tabs" hidden>
                <button class="route-drawing-type-btn active" data-type="평면도">평면도</button>
                <button class="route-drawing-type-btn" data-type="용지도">용지도</button>
                <button class="route-drawing-type-btn" data-type="매설물도">매설물도</button>
                <button class="route-drawing-type-btn" data-type="구조물도">구조물도</button>
            </div>
            <div id="route-file-list"></div>
        </div>

        <div id="dxf-layer-panel">
            <div class="list-header">레이어(구조물 종류)</div>
            <div id="dxf-layer-list"><div class="tree-empty">DXF 파일을 열면 레이어 목록이 여기에 표시됩니다.</div></div>
        </div>
    </div>
</div>

<script src="cad-viewer.js"></script>
<script>
// 부모 창(메인 화면)이 보고 있던 노선/도면을 그대로 이어서 연다.
// 부모 창이 닫혔거나 없으면(직접 URL 접근 등) 빈 상태로 둔다.
(function initCadPopup() {
    initRouteFileTabs();
    initCadToolbarButtons();
    initDxfCanvas();

    // 메인 화면에서 특정 도면을 보다가 큰 화면으로 띄운 창이라, 기본 탭을
    // "도로"(구간 고르기)가 아니라 "도면"으로 맞춘다 — 그래야 열자마자 원래
    // 보던 구간의 도면이 바로 보인다("도로" 탭은 여전히 눌러서 구간을 바꿀 수 있음).
    document.querySelectorAll('#route-file-tabs .route-tab-button').forEach((b) => b.classList.remove('active'));
    const drawingTabBtn = document.querySelector('#route-file-tabs .route-tab-button[data-cat="도면종류"]');
    if (drawingTabBtn) drawingTabBtn.classList.add('active');
    currentRouteCategory = '도면종류';
    const drawingTypeTabsEl = document.getElementById('route-drawing-type-tabs');
    if (drawingTypeTabsEl) drawingTypeTabsEl.hidden = false;

    // window.opener는 팝업 차단을 나중에 수동으로 허용하는 흐름 등에서 브라우저가
    // 끊어버리는 경우가 있어(실사용 중 확인됨) 신뢰하지 않는다 — 대신 팝업을 열 때
    // 실어보낸 URL 쿼리스트링에서 상태를 읽는다.
    const q = new URLSearchParams(location.search);
    const routeName = q.get('route_name');
    const hasRoute = q.has('road_grade') && (q.get('road_grade') || q.get('route_name'));

    document.title = routeName ? `${routeName} - 도면 뷰어` : '도면 뷰어';

    if (hasRoute) {
        currentRoute = {
            road_rank_name: q.get('road_grade') || '',
            road_grade: q.get('road_grade') || '',
            route_no: q.get('route_no') || '',
            route_name: q.get('route_name') || '',
            sect: q.get('sect') || '',
            s_point: q.get('s_point') || '',
            e_point: q.get('e_point') || '',
            rdid: q.get('rdid') || '',
            length_m: q.get('length_m') || '',
        };
        document.getElementById('ri-road-grade').textContent = currentRoute.road_rank_name || '-';
        document.getElementById('ri-route-name').textContent = currentRoute.route_name || '-';
        document.getElementById('ri-segment-name').textContent = currentRoute.sect ? `${currentRoute.sect}구간` : '-';
        document.getElementById('ri-start-point').textContent = currentRoute.s_point || '-';
        document.getElementById('ri-end-point').textContent = currentRoute.e_point || '-';
        document.getElementById('ri-length').textContent = formatLengthM(currentRoute.length_m);
        document.getElementById('route-export-btn').style.display = currentRoute.rdid ? '' : 'none';

        refreshRouteFilePanel();
        loadRouteFacilityCounts(currentRoute);
    } else {
        document.getElementById('cad-empty-msg').innerHTML =
            '메인 화면에서 노선을 선택한 뒤 다시 열어주세요.';
    }

    const fileUrl = q.get('file_url');
    if (fileUrl) {
        loadDxfFile(fileUrl, q.get('file_name') || '');
    }
})();
</script>
</body>
</html>
